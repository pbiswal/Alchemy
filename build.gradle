/*
 * Alchemy build.
 *
 * Replaces the NetBeans/Ant pipeline (build.xml + nbproject/), which cannot run
 * any more: it pins source/target compatibility to Java 1.5, which every JDK 12+
 * rejects, and it generated its project files. The legacy files are kept for
 * reference only - do not use them to build.
 *
 * Useful tasks:
 *   ./gradlew build        compile + jar + package every module zip
 *   ./gradlew run          launch Alchemy against the staged distribution
 *   ./gradlew smokeTest    launch headlessly (use xvfb-run on Linux), verify all
 *                          modules register, render the window, write PNG evidence
 *   ./gradlew dist         staged distribution: build/dist/{alchemy.jar,lib,modules}
 *   ./gradlew distArchive  build/distributions/{tar.gz,zip,SHA256SUMS.txt}
 *   ./gradlew verifyDist   unpack distArchive and run it through its own launcher
 *   ./gradlew harnessTest  test the smoke harness's own log parsing (no display)
 *
 * Workstream 1 of MAINTENANCE.md. Keep this file dependency-light: the third
 * party jars are still vendored in lib/ and moving them to Maven Central is a
 * separate, reviewable change.
 *
 * Copyright (c) 2007-2010 Karl D.D. Willis. Licensed under the GPLv3 - see
 * LICENSE.md.
 */
plugins {
    id 'java'
}

apply from: 'gradle/archive-stamps.gradle'

/*
 * Bound to locals so task actions can call them: plain `stampArchive(...)` written inside a task
 * action resolves against the task rather than the project's extra properties and fails at
 * execution time with "Could not find method stampArchive()".
 */
def stampArchive = ext.stampArchive
def entryDateProblems = ext.entryDateProblems

/*
 * Snapshots of script objects that task actions may not touch: resolving rootDir, calling file(), or
 * reading project from inside a task action is a configuration-cache violation, so the values are
 * taken while configuring and the actions only ever see plain Strings and Files. Declared above every
 * closure that uses them: a def local is not in the script binding, so a closure defined before its
 * declaration throws MissingProperty at execution time.
 */
def repoDir = rootDir
def versionString = project.version.toString()

group = 'org.alchemy'
version = providers.gradleProperty('alchemyVersion').getOrElse('0.9.0')

/*
 * Language/API baseline. `--release` means the build runs on any JDK >= 17 while
 * still failing if newer JDK APIs are used, so a JDK 17 user can build exactly
 * what a JDK 25 user builds. Raise this together with the README badge.
 */
def javaBaseline = 17

/*
 * The sources still contain Latin-1 bytes (see MAINTENANCE.md Workstream 3:
 * normalise to UTF-8). Compiling them as UTF-8 today would silently corrupt the
 * affected string literals, so the encoding stays as the legacy build declared.
 */
def sourceEncoding = 'ISO-8859-1'

/*
 * Only the java plugin is applied, deliberately not `application`. That plugin contributes
 * startScripts/installDist/distTar/distZip which produced a distribution this project
 * cannot use - scripts without java.library.path, and archives without the module zips - so
 * `./gradlew tasks` advertised four ways of packaging Alchemy while all four were subtly
 * wrong and only :dist actually ran. :dist plus :distArchive are now the single answer, and
 * every start script in the repository is one reviewed file (packaging/Alchemy.sh) instead
 * of a generated template.
 */
def mainClassName = 'org.alchemy.core.Alchemy'

sourceSets {
    main {
        java.srcDirs = ['src']
        resources {
            // Resource files (PNGs, .properties, .html) sit next to the sources,
            // which javac ignores; without this the app jar has no icons and no
            // string bundle.
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
    // Verification harness. Not shipped: it is never added to the application
    // jar, only to the smokeTest classpath.
    smoke {
        java.srcDirs = ['harness/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    // Nothing is resolved from here yet - declared for the Maven Central
    // migration that replaces the vendored jars.
    mavenCentral()
}

dependencies {
    /*
     * Vendored third party jars: JPF 1.5.1 + its libs, Quaqua, Batik, iText,
     * Foxtrot, JPen, MigLayout, Quaerite Prefs, the Alchemy OpenGL bindings.
     * lib/ant holds the old Ant helper tasks and is deliberately excluded.
     *
     * lib/jpen/jpen-tiger/jpen-2.jar is a second, Java 5 era copy of the jar in
     * lib/jpen; loading both means whichever sorts first wins, so only the
     * current one is on the classpath.
     */
    implementation files(fileTree(dir: 'lib', include: ['**/*.jar'], excludes: ['ant/**', 'jpen/jpen-tiger/**']))
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaBaseline
    options.encoding = sourceEncoding
    // The codebase predates generics discipline; keep warnings visible without
    // failing the build (see MAINTENANCE.md Workstream 3 for the cleanup plan).
    options.compilerArgs += ['-Xlint:deprecation,unchecked']
}

tasks.withType(AbstractArchiveTask).configureEach {
    // Reproducible archives: same inputs -> same bytes, so CI can cache and
    // developers can diff what they are about to ship.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

/*
 * What makes the jar runnable outside Gradle. Up to 2026 the only documented way of
 * launching a source build was the IDE, and an IDE puts the dependencies on the command
 * line itself, so nothing noticed that the jar could not start on its own:
 * "java -jar build/libs/alchemy.jar" died with NoClassDefFoundError:
 * jpen/event/PenListener. "Does the artifact run?" is a different question from "does
 * the code compile?", and only :verifyDist can answer it.
 *
 * The jar stays thin on purpose: repackaging the GPL binary dependencies into one fat
 * jar would make licence provenance harder to trace for no user benefit.
 */
def manifestClassPath = providers.provider {
    // Resolved at execution time: a configuration must not be resolved while the build
    // script is being configured.
    def names = configurations.runtimeClasspath.files.collect { it.name }.sort()
    def awkward = names.findAll { it.contains(' ') || it.contains('%') }
    if (!awkward.isEmpty()) {
        throw new GradleException("Class-Path is space separated and URI encoded, so " +
                "${awkward} cannot be referenced from a manifest. Rename the jar(s).")
    }
    names.collect { "lib/${it}" }.join(' ')
}

tasks.named('jar', Jar) {
    // Unversioned so the launcher, the manifest and "java -jar alchemy.jar" all agree
    // about one name, and so re-packing never requires editing a start script.
    archiveFileName = 'alchemy.jar'
    manifest {
        attributes(
                'Main-Class': mainClassName,
                'Implementation-Title': 'Alchemy',
                'Implementation-Version': project.version,
                'Build-Jdk-Spec': javaBaseline
        )
    }
    doFirst {
        manifest.attributes 'Class-Path': manifestClassPath.get()
    }
}

/* ------------------------------------------------------------------ modules */

/*
 * A JPF module archive must be named "<plugin-id>-<version>.zip" - AlcPlugins
 * looks for a file in ./modules whose name contains the plugin id and treats a
 * missing match as a fatal error. The source folder names do not follow that
 * convention, so the id/version are read from each plugin.xml.
 *
 * Module zips are build output. Never commit them: they are generated from the
 * module sources, and committing built artefacts is how the 182 MB releases/
 * directory happened.
 */
def moduleSourceDirs = {
    def root = new File(repoDir, 'modules')
    root.listFiles().findAll { it.isDirectory() && new File(it, 'plugin.xml').isFile() }.sort { it.name }
}

def moduleCoordinates = { File dir ->
    def xml = new File(dir, 'plugin.xml').getText(sourceEncoding)
    def matcher = xml =~ /<plugin\s+id="([^"]+)"\s+version="([^"]+)"/
    if (!matcher.find()) {
        throw new GradleException("No <plugin id=\"...\" version=\"...\"> found in ${dir}/plugin.xml")
    }
    [id: matcher.group(1), version: matcher.group(2)]
}

def moduleArchives = layout.buildDirectory.dir('modules')

def moduleZipTasks = moduleSourceDirs().collect { dir ->
    def coords = moduleCoordinates(dir)
    def taskName = 'moduleZip' + dir.name.replaceAll('[^A-Za-z0-9]', '_')
    tasks.register(taskName, Zip) {
        group = 'alchemy'
        description = "Package ${coords.id} ${coords.version} as a JPF module archive"
        archiveFileName = "${coords.id}-${coords.version}.zip"
        destinationDirectory = moduleArchives
        includeEmptyDirs = false
        from(dir) {
            // plugin.xml plus the auxiliary directories JPF references:
            // images/ (icons), help/ (help sets), data/ (shape resources),
            // app/ (menu bindings) and the shape PDF collections.
            exclude '**/.DS_Store'
        }
    }
}

tasks.register('moduleZips') {
    group = 'alchemy'
    description = 'Package every JPF module under modules/ into build/modules'
    dependsOn moduleZipTasks
}

/* --------------------------------------------------------------------- dist */

/*
 * The application resolves its modules from "./modules" relative to the working
 * directory (Alchemy.java: new File("modules")), so it cannot run from the
 * project root, where modules/ holds sources. `dist` stages a runnable layout
 * and every launch task uses it as the working directory.
 */
def distDir = layout.buildDirectory.dir('dist')

/*
 * Provenance has to be generated to be true. A hand-edited "built from commit X" line in
 * a release notes file is wrong in exactly the releases where it matters, so NOTICE.txt -
 * which ships inside the archive - is stamped by the build. It says plainly that this is
 * an unofficial community build of an unmaintained upstream.
 *
 * The stamp runs git through ProcessBuilder inside the task, on the reasoning that a
 * build-time side effect belongs to a task. It matters here: the first version read the
 * stamp while configuring with Gradle's exec and a catch-all around it, and every package
 * this session shipped said "commit unknown" - a provenance file that lies quietly is the
 * worst kind. Reading git inside the task makes the stamp visible in the build log.
 */
def gitOutput = { File repo, List<String> args ->
    def proc = new ProcessBuilder((['git'] + args)).directory(repo).start()
    def out = proc.inputStream.getText('UTF-8')
    proc.errorStream.getText('UTF-8')
    if (!proc.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
        proc.destroyForcibly()
        throw new IllegalStateException("git ${args.join(' ')} timed out")
    }
    if (proc.exitValue() != 0) {
        throw new IllegalStateException("git ${args.join(' ')} exited ${proc.exitValue()}")
    }
    return out.trim()
}

/*
 * The instant stamped on every release archive entry: the commit time of the tree being built. Read
 * *inside* the tasks that need it, never while configuring: the configuration cache treats a git call
 * there as an error, and a stamp taken while configuring would describe whatever HEAD was when the
 * build was first configured. Null when building from a tarball with no git metadata, in which case
 * the package check stops asserting dates rather than asserting a fiction.
 */
def commitStamp = { ->
    try {
        return Long.parseLong(gitOutput(repoDir, ['log', '-1', '--format=%ct']).trim())
    } catch (Exception e) {
        // No git means a source tarball, and that must not fail a build. Say what was assumed
        // rather than going quiet: a swallowed exception here would silently stop every release
        // being stamped.
        println "no git commit time available (${e.class.simpleName}: ${e.message?.readLines()?.find { it.trim() }})"
        println 'archives keep the entry times Gradle wrote and :checkPackage will not assert them'
        return null
    }
}

def noticeFile = tasks.register('noticeFile') {
    group = 'alchemy'
    description = 'Generate NOTICE.txt (provenance and known limitations of this build)'
    def template = new File(repoDir, 'packaging/NOTICE.template')
    def target = layout.buildDirectory.file('notice/NOTICE.txt')
    inputs.file template
    inputs.property 'version', versionString
    outputs.file target
    // Provenance is read from git on every run. It cannot be a declared input without
    // reading it while configuring, and Gradle 9 reports exec at configuration time as a
    // problem - so the task simply never claims to be up to date rather than shipping a
    // NOTICE.txt that names the commit of some earlier build.
    outputs.upToDateWhen { false }
    doLast {
        String commit
        try {
            def sha = gitOutput(repoDir, ['rev-parse', '--short', 'HEAD'])
            commit = gitOutput(repoDir, ['status', '--porcelain']) ? "${sha} (dirty working tree)" : sha
        } catch (Exception ignored) {
            // Building from a source tarball: no git, no provenance, no failure.
            commit = 'unknown (source was not a git checkout)'
        }
        // Tokens, not expand(): expand() runs a template engine over the file, so a
        // stray "$" in prose would become a build failure.
        target.get().asFile.text = template.getText('UTF-8')
                .replace('@VERSION@', versionString)
                .replace('@COMMIT@', commit)
        println "NOTICE.txt stamped with commit ${commit}"
    }
}

/** Top-level directory name inside the release archives. */
def distName = "alchemy-${project.version}"
def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

def stageDist = tasks.register('dist', Sync) {
    group = 'alchemy'
    description = 'Stage a runnable distribution in build/dist (jar + dependency jars + module archives)'
    dependsOn jar, moduleZips, noticeFile
    into distDir

    from(moduleArchives) {
        into 'modules'
    }
    from(jar) {
        rename { 'alchemy.jar' }
    }
    // The manifest's Class-Path says "lib/<name>", so the dependency jars have to be
    // copied flat into lib/ with their original names. FAIL rather than EXCLUDE: two
    // vendored jars sharing a name would otherwise be resolved by whichever Gradle
    // happened to iterate first.
    from(configurations.runtimeClasspath) {
        into 'lib'
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
    // JPen's loader looks for its JNI library on java.library.path; keep the packaged
    // layout self-contained.
    from('lib/jpen') {
        into 'lib/jpen'
        include '*.so', '*.dylib', '*.dll', '*.jnilib'
    }
    from('packaging/Alchemy.sh') {
        rename { 'Alchemy' }
    }
    from('packaging/Alchemy.bat')
    from(noticeFile)
    from('LICENSE.md')
    from('README.md')

    eachFile { details ->
        // A non-executable ./Alchemy in a tarball is the classic self-inflicted release
        // bug. Gradle 9 sets modes through an action on ConfigurableFilePermissions;
        // `details.permissions.unix(...)` looks right but hits the read-only view.
        details.permissions { perms ->
            perms.unix(details.name == 'Alchemy' ? 0755 : 0644)
        }
    }
}

/**
 * JVM args shared by the tasks that launch Alchemy.
 *
 * JPen loads its JNI library with System.loadLibrary from an unnamed module. JDK 18+
 * warns about that (and will block it in a future release), so opt in where the flag
 * exists - JDK 17 does not recognise the option and would refuse to start, which is
 * the one thing the CI matrix would then blame the application for.
 */
ext.applicationJvmArgs = {
    def args = ['-Xmx512m']  // matches the memory ceiling of the 008 launchers
    if (JavaVersion.current() >= JavaVersion.VERSION_18) {
        args << '--enable-native-access=ALL-UNNAMED'
    }
    return args
}

tasks.register('run', JavaExec) {
    description = 'Launch Alchemy from the staged distribution in build/dist'
    dependsOn stageDist
    classpath = sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    workingDir = distDir.get().asFile
    systemProperty 'java.library.path', file('lib/jpen').absolutePath
    jvmArgs applicationJvmArgs()
}

/* -------------------------------------------------------------- release media */

/*
 * The publishable archives. build/dist doubles as the working directory of :run and
 * :smokeTest, so it accumulates log/ and smoke-result.txt; the archives therefore name
 * exactly what may ship instead of excluding what may not. Nothing can leak into a
 * release by being forgotten.
 */
def releaseIncludes = ['Alchemy', 'Alchemy.bat', 'alchemy.jar', 'NOTICE.txt',
                       'LICENSE.md', 'README.md', 'lib/**', 'modules/**']

/*
 * One package for every platform. The archive carries the JPen native library for
 * each OS, so there is nothing platform-specific to select and three "per-platform"
 * archives would be the same bytes under three names. The release workflow therefore
 * publishes this name once; the other runners build and check it without shipping
 * their copy.
 */
def distBaseName = "${distName}-unofficial"

def distTar = tasks.register('distTar', Tar) {
    description = 'Pack the distribution as a .tar.gz'
    dependsOn stageDist
    from(stageDist)
    into distName
    include releaseIncludes
    // The mode on the staged file is what tar records; restate it so an archive built
    // from a working tree on a FAT-mounted volume still carries the launcher bit.
    eachFile { details ->
        details.permissions { perms -> perms.unix(details.name == 'Alchemy' ? 0755 : 0644) }
    }
    archiveFileName = "${distBaseName}.tar.gz"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    compression = Compression.GZIP
    doLast {
        def stamp = commitStamp()
        if (stamp != null) {
            println "tar entry times set to commit ${stamp} for ${stampArchive(archiveFile.get().asFile, stamp)} entries"
        }
    }
}

def distZip = tasks.register('distZip', Zip) {
    description = 'Pack the distribution as a .zip'
    dependsOn stageDist
    from(stageDist)
    into distName
    include releaseIncludes
    eachFile { details ->
        details.permissions { perms -> perms.unix(details.name == 'Alchemy' ? 0755 : 0644) }
    }
    archiveFileName = "${distBaseName}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    doLast {
        def stamp = commitStamp()
        if (stamp != null) {
            println "zip entry times set to commit ${stamp} for ${stampArchive(archiveFile.get().asFile, stamp)} entries"
        }
    }
}

def distChecksums = tasks.register('distChecksums') {
    description = 'Write SHA256SUMS.txt next to the release archives'
    dependsOn distTar, distZip
    def sums = layout.buildDirectory.file('distributions/SHA256SUMS.txt')
    inputs.files distTar, distZip
    outputs.file sums
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def lines = inputs.files.files.sort { it.name }.collect {
            digest.reset()
            def bytes = it.bytes
            "${digest.digest(bytes).collect { String.format('%02x', it) }.join('')}  ${it.name}"
        }
        sums.get().asFile.text = lines.join('\n') + '\n'
        println "Checksums: ${lines.join(' ')}"
    }
}

def distArchive = tasks.register('distArchive') {
    group = 'alchemy'
    description = 'Build the release archives and their checksums into build/distributions'
    dependsOn distTar, distZip, distChecksums
}

/* --------------------------------------------------------- distribution tests */

/*
 * Unpack what was actually packed, into a directory nothing else writes to. Reading
 * from build/dist instead would test the staging, not the archive, and an archive that
 * is missing a file is a release-day bug nobody sees until a user reports it.
 */
def packagedRoot = new File(layout.buildDirectory.asFile.get(), 'verify-package')
def packagedDir = new File(packagedRoot, distName)

def unpackDist = tasks.register('unpackDist', Sync) {
    group = 'verification'
    description = 'Unpack the release archive into build/verify-package'
    dependsOn(isWindows ? distZip : distTar)
    from(isWindows ? zipTree(distZip.flatMap { it.archiveFile })
                    : tarTree(distTar.flatMap { it.archiveFile }))
    into packagedRoot
}
def checkPackage = tasks.register('checkPackage') {
    group = 'verification'
    description = 'Assert the packed distribution is complete and self-describing'
    // distZip as well as the unpacked tree: the entry dates exist only in the archives, and
    // unpacking is where a bad build can hide a problem.
    dependsOn unpackDist, distZip
    // Providers, captured while configuring: reaching for the distTar/distZip *task objects* from
    // the action is a configuration-cache violation, and the archive paths are all this needs.
    def tarFile = distTar.flatMap { it.archiveFile }
    def zipFile = distZip.flatMap { it.archiveFile }
    doLast {
        def root = packagedDir
        def appJar = new File(root, 'alchemy.jar')
        if (!appJar.isFile()) {
            throw new GradleException("${appJar} missing from the unpacked archive.")
        }
        def jar = new java.util.jar.JarFile(appJar)
        try {
            def manifest = jar.manifest
            def mainClass = manifest?.getMainAttributes()?.getValue('Main-Class')
            if (!mainClass) {
                throw new GradleException("${appJar} has no Main-Class: double-clicking it cannot work.")
            }
            def entries = (manifest.getMainAttributes().getValue('Class-Path') ?: '').split(' ').findAll { it }
            def missing = entries.findAll { !new File(root, it).isFile() }
            if (!entries || missing) {
                throw new GradleException("Class-Path is ${entries.size()} entries, ${missing.size()} " +
                        "not in the archive: ${missing.take(5)}. A jar packaged this way throws " +
                        "NoClassDefFoundError on the user's machine.")
            }
            def archives = new File(root, 'modules').listFiles()?.findAll { it.name.endsWith('.zip') } ?: []
            def expected = moduleSourceDirs().size()
            if (archives.size() != expected) {
                throw new GradleException("${archives.size()} module archives in the package, " +
                        "${expected} under modules/. The distribution is incomplete.")
            }
            def launcher = new File(root, isWindows ? 'Alchemy.bat' : 'Alchemy')
            if (!launcher.isFile()) {
                throw new GradleException("${launcher} missing from the archive.")
            }
            if (!isWindows && !launcher.canExecute()) {
                throw new GradleException("${launcher} is not executable in the unpacked archive.")
            }
            if (!new File(root, 'NOTICE.txt').isFile()) {
                throw new GradleException("NOTICE.txt missing: a release must state what it is.")
            }
            if (new File(root, 'NOTICE.txt').text =~ /@(VERSION|COMMIT)@/) {
                throw new GradleException('NOTICE.txt still holds an unsubstituted template token.')
            }
            // build/dist doubles as the working directory of run/smokeTest, so it
            // accumulates log/ and result files. A release must not carry them.
            ['build', 'src', 'log'].each { banned ->
                if (new File(root, banned).exists()) {
                    throw new GradleException("${banned}/ leaked into the release archive.")
                }
            }
            def strays = []
            root.eachFileRecurse { if (it.name.endsWith('.class')) strays << it.name }
            if (strays) {
                throw new GradleException("Loose class files in the archive: ${strays.take(3)}")
            }
            if (!new File(root, 'README.md').isFile() || !new File(root, 'LICENSE.md').isFile()) {
                throw new GradleException('README.md or LICENSE.md missing from the archive.')
            }
            // Entry dates, asserted on the archives themselves: unpacking cannot see them. A
            // stamping tool that nothing checks is a stamping tool that silently stops working,
            // and "silently" is the failure this whole detour exists to avoid.
            def stamp = commitStamp()
            if (stamp != null) {
                def tarArch = tarFile.get().asFile
                def zipArch = zipFile.get().asFile
                def dateProblems = entryDateProblems(tarArch, zipArch, stamp)
                if (dateProblems) {
                    throw new GradleException('Release archive entry dates are wrong:\n  ' +
                            dateProblems.join('\n  '))
                }
                println "Package check: every entry of ${tarArch.name} and ${zipArch.name} " +
                        "dated with commit ${stamp}"
            }
            println "Package check: Main-Class=${mainClass}, " +
                    "classpath_entries=${entries.size()}, module_archives=${archives.size()}, launcher=${launcher.name}"
        } finally {
            jar.close()
        }
    }
}

def verifyDist = tasks.register('verifyDist', JavaExec) {
    group = 'verification'
    description = 'Run the unpacked release archive through its own launcher and assert every module started'
    dependsOn checkPackage
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'org.alchemy.harness.ArtifactSmokeTest'
    workingDir = packagedDir
    args packagedDir,
            providers.gradleProperty('artifactTimeout').getOrElse('180'),
            String.valueOf(moduleSourceDirs().size())
    systemProperty 'alchemy.artifact.result',
            new File(layout.buildDirectory.asFile.get(), 'artifact-result.txt').absolutePath
}

/* --------------------------------------------------------------- smoke test */

/*
 * A launch that exits 0 proves almost nothing: the app calls System.exit(0) on
 * the "no modules found" path. The harness therefore has to write an explicit
 * success marker, and that marker is what this task verifies.
 */
tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = 'Boot Alchemy on a private display, assert the UI shell built and every module archive registered'
    dependsOn stageDist

    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'org.alchemy.harness.SmokeTest'
    workingDir = distDir.get().asFile

    systemProperty 'java.library.path', file('lib/jpen').absolutePath
    jvmArgs applicationJvmArgs()
    args providers.gradleProperty('smokeTimeout').getOrElse('120')

    doLast {
        def marker = new File(workingDir, 'smoke-result.txt')
        if (!marker.isFile()) {
            throw new GradleException(
                    "Smoke test produced no ${marker}. The app most likely called System.exit() during boot " +
                    "(see ${new File(workingDir, 'log/alchemy.txt')} and the output above).")
        }
        def result = marker.text.readLines().find { it.startsWith('result=') }?.substring(7)
        if (result != 'PASS') {
            throw new GradleException("Smoke test failed: ${marker.text}")
        }
        println "Smoke test passed: ${marker.text.readLines().findAll { !it.startsWith('result=') }*.toString().join('; ')}"
    }
}

tasks.named('test') {
    // No application unit tests yet (MAINTENANCE.md Workstream 2). Declared so
    // `build` is honest about what is, and is not, verified.
    description = 'No application unit tests yet - run :harnessTest and :smokeTest'
}

/*
 * Harness self-test. The smoke test is what makes CI mean something, so its log
 * parsing is tested too. It needs neither Alchemy nor a display, so it runs in check
 * on every OS. Dependency-free by design: no test framework is downloaded, so this
 * still works offline on a cold machine.
 */
def harnessTest = tasks.register('harnessTest', JavaExec) {
    group = 'verification'
    description = 'Tests the smoke harness log parsing.'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'org.alchemy.harness.HarnessTest'
}

tasks.named('check') { dependsOn harnessTest }
