#
# Publishing pipeline. Pushing a tag shaped like v0.9.0 builds ONE distribution on
# that exact commit, launch-tests it, and attaches it to a GitHub Release.
#
# There is one package, not three, because there is nothing platform-specific to
# select: the archive carries the JPen native libraries for every OS. Publishing
# alchemy-<v>-linux.tar.gz / -macos / -windows would be the same bytes under three
# names, and a reader would reasonably assume they differ. The three runners still
# each build and structurally check the package, which is what makes the single
# archive trustworthy rather than merely convenient - see verify-recipe below.
#
# Packaging happens here rather than on a laptop so an artifact cannot carry
# unrepeatable local state: the tag says which commit, the workflow log says which
# toolchain, and NOTICE.txt inside the archive says both.
#
# Two documents for two audiences. The release body is user-facing: what the program
# is, which file to download, how to start it, what to expect. It names no Gradle task,
# no CI job and no exception trace. The technical half - provenance, toolchain,
# what was verified on which OS, known defects, how to build it - is generated as
# RELEASE_NOTES.md and attached as an asset. Both are generated here rather than
# written by hand, so neither can drift from the tag it describes, and neither has to
# serve the other's reader.
#
name: Release

on:
  push:
    tags:
      # Only point releases. Requiring the leading "v" and digits keeps a stray
      # branch or tag name from ever matching and publishing something by accident.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  # Creating the release and uploading its assets.
  contents: write

jobs:
  package:
    # The published bytes are built here, on Linux, because Linux is where the
    # package can also be launched. A package built on Windows and launched
    # elsewhere would leave the launch verdict describing a different build.
    name: Package and launch
    runs-on: ubuntu-latest
    env:
      GRADLE_EXIT_CODE: 0
    steps:
      - uses: actions/checkout@v7

      # One toolchain for published artifacts. Bytecode targets --release 17 no
      # matter what builds it, but pinning keeps the launcher's version probe and the
      # native library handling identical from release to release.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        shell: bash
        # The tag is v0.9.0; the version inside the package is 0.9.0.
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, check and launch the package
        shell: bash
        # verifyDist unpacks the archive and starts it through its own ./Alchemy
        # launcher: the only check that can see a missing module directory, a jar name
        # the manifest does not match, or a launcher that forgot java.library.path.
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./gradlew --no-daemon \
              "-PalchemyVersion=${{ steps.version.outputs.value }}" \
              distArchive checkPackage verifyDist \
            || echo "GRADLE_EXIT_CODE=$?" >> "$GITHUB_ENV"
          cat build/distributions/SHA256SUMS.txt

      - name: Publish the packaged launch verdict
        if: always()
        shell: bash
        # The verdict file is the harness's own account of what it launched and saw;
        # the step summary is where a reviewer looks first.
        run: |
          if [ -f build/artifact-result.txt ]; then
            cat build/artifact-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$GRADLE_EXIT_CODE"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: build/distributions/
          if-no-files-found: error
          retention-days: 30

  verify-recipe:
    # Same recipe, other operating systems. Nothing from here is published: these
    # runners prove the packaging build itself is portable (the launcher bit, the
    # jar whitelist, the NOTICE stamp) and that their archive is the same one Linux
    # published, by printing the checksum into the job log for comparison.
    # Windows additionally tries launching the package, informationally: its start-up
    # is green in CI, and this is the platform most users have. macOS does not, because
    # its runtime is known-red - see MAINTENANCE.md.
    name: Verify packaging recipe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and check the package
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            "-PalchemyVersion=${{ steps.version.outputs.value }}" \
            distArchive checkPackage
          {
            echo "### Packaging recipe on ${{ matrix.os }}"
            echo
            echo 'Structural check passed. Checksums built here:'
            echo
            echo '```'
            cat build/distributions/SHA256SUMS.txt
            echo '```'
            echo
            echo 'Gradle writes archive entries with fixed timestamps, so these are expected'
            echo 'to equal the published archive byte for byte - the v0.9.0 run produced the'
            echo 'same hash on all three runners. A difference here is a real difference in'
            echo 'the bytes, not a timestamp.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately non-blocking: a first run on a real tag has to show whether the
      # packaged Alchemy.bat starts in a Windows runner at all. When it has been seen
      # passing, drop this step's if/verdict handling and make verifyDist a normal step
      # so Windows gates the release the way Linux does.
      - name: Launch the package here (informational, Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -uo pipefail
          if ./gradlew --no-daemon "-PalchemyVersion=${{ steps.version.outputs.value }}" verifyDist
          then
            verdict=PASS
          else
            verdict=FAIL
          fi
          {
            echo "### Packaged launch on ${{ matrix.os }}"
            echo
            echo "- verdict: \`$verdict\` (informational - Windows does not gate the release yet)"
            echo
            echo '```'
            cat build/artifact-result.txt 2>/dev/null || echo '(no result file written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = FAIL ]
          then
            echo "::warning::the packaged launcher did not prove itself on ${{ matrix.os }}"
          fi

  release:
    name: Publish GitHub Release
    needs: [package, verify-recipe]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the package
        uses: actions/download-artifact@v6
        with:
          name: package
          path: assets

      - name: Confirm the package survived the artifact round-trip
        working-directory: assets
        shell: bash
        # The checksums were written by the runner that produced the bytes. Verifying
        # them again here means the release cannot ship an asset that differs from what
        # was launch-tested, whoever moved it in between.
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          ls -l

      - name: Release notes (user-facing)
        shell: bash
        # Two documents, two audiences. This one is for somebody who wants to draw:
        # what it is, which file to download, how to start it, what to expect. No task
        # names, no CI job names, no exception traces - those all go to RELEASE_NOTES.md.
        # Backticks are bare inside single quotes; \"`\" only where the line is double-quoted.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGZ="alchemy-${VERSION}-unofficial.tar.gz"
          ZIP="alchemy-${VERSION}-unofficial.zip"
          {
            echo 'Alchemy is a drawing program for pen and tablet: choose a shape, draw it,'
            echo 'and modules change what you drew. Karl D.D. Willis wrote it between 2007 and'
            echo '2011 and released it under the GNU GPL v3.'
            echo
            echo "### Alchemy ${VERSION} (unofficial build)"
            echo
            echo 'This is the same program rebuilt so that it starts on a current 64-bit Java'
            echo 'instead of a 2007 one. It is not a new version of Alchemy, and it is not from'
            echo 'the original project, which has been quiet since 2018.'
            echo
            echo '### What you need'
            echo
            echo 'Java 17 or newer, 64-bit - 17, 21 and 25 are all fine. Nothing else: no'
            echo 'installer, no admin rights, no internet once the download is finished.'
            echo
            echo '### Download and run'
            echo
            echo '| Your system | Download | To start it |'
            echo '| --- | --- | --- |'
            echo "| Windows | \`$ZIP\` | Unpack, then double-click **Alchemy.bat** |"
            echo "| Linux | \`$TARGZ\` | Unpack, open a terminal in the new folder, run \`./Alchemy\` |"
            echo "| macOS | \`$TARGZ\` | Unpack, open a terminal in the new folder, run \`./Alchemy\` - and read the macOS note below |"
            echo
            echo "Unpack it somewhere you are allowed to write, such as your Desktop or Home"
            echo "folder - not Program Files. It unpacks to one folder, \`alchemy-$VERSION\`, and"
            echo 'everything is inside it.'
            echo
            echo 'Alchemy keeps your drawings and its own log in folders next to itself, so it'
            echo 'will not work somewhere that forbids writing.'
            echo
            echo 'Nothing is installed on your system, which means deleting that folder removes'
            echo 'Alchemy. Your drawings are in its `shapes` folder, so copy that out first.'
            echo
            echo '### Does my tablet work?'
            echo
            echo 'Yes. Wacom tablets work on Windows and Linux, and pen pressure changes the'
            echo 'width of the line. A mouse works on every system.'
            echo
            echo '### What to expect'
            echo
            echo '- It looks like 2007. That is deliberate: nothing about the interface has been'
            echo '  changed.'
            echo '- If no window appears, the cause is almost always Java. Run `java -version` in'
            echo '  a terminal and check it says 17 or higher. If it says `command not found`,'
            echo '  install a 64-bit JDK and try again.'
            echo '- On macOS a window flashes up and the program quits. That is a known fault in'
            echo '  this build, not something you did. macOS is the next thing being fixed.'
            echo '- Files in the archive are dated the day of the commit they were built from,'
            echo '  so an unpacked folder shows when it was made rather than 1970.'
            echo '- 32-bit Windows is not supported; no 32-bit build has been made since 2011.'
            echo
            echo '### Checking the download is intact'
            echo
            echo 'Save **SHA256SUMS.txt** in the same folder as the archive, then:'
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS.txt    # Linux, macOS'
            echo '```'
            echo
            echo 'On Windows, run'
            echo
            echo '```cmd'
            echo "certutil -hashfile $ZIP SHA256"
            echo '```'
            echo
            echo 'and compare the printed value with the one listed in SHA256SUMS.txt.'
            echo
            echo '### Also in this release'
            echo
            echo '- **NOTICE.txt**, inside the archive: who wrote what, and the licence terms.'
            echo '- **RELEASE_NOTES.md**, attached below: how this build was made and tested,'
            echo '  what is known to be broken, and how to build it yourself. Ignore it if you'
            echo '  just want to draw.'
            echo "- Source: https://github.com/pbiswal/Alchemy at tag \`$GITHUB_REF_NAME\`."
            echo '- Releases from the original project, back in 2011, are still where they were.'
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Technical notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL=$(echo assets/alchemy-*.tar.gz)
          MODCOUNT=$(tar tzf "$TARBALL" | grep -c '/modules/.*\.zip$' || true)
          LIBCOUNT=$(tar tzf "$TARBALL" | grep -c '/lib/.*\.jar$' || true)
          {
            echo "# Technical notes for v${VERSION}"
            echo
            echo 'The release description is the user-facing note; this file is the build report behind it.'
            echo
            echo '## Provenance'
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| Tag | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Built by | run \`$GITHUB_RUN_ID\` from \`.github/workflows/release.yml\` |"
            echo '| Workflow run | https://github.com/pbiswal/Alchemy/actions/runs/'"$GITHUB_RUN_ID"' |'
            echo '| Build JDK | 17, compiled with `--release 17` |'
            echo '| Runtime downloads | none - dependencies are vendored under `lib/` |'
            echo '| Artifacts | one portable pair: `lib/jpen` carries the native tablet library for every OS |'
            echo
            echo '## Inside the archive'
            echo
            echo "\`alchemy.jar\` (thin jar with a \`Class-Path\` manifest), $LIBCOUNT dependency jars in"
            echo "\`lib/\`, JPen plus its native libraries in \`lib/jpen/\`, $MODCOUNT module archives in"
            echo '`modules/`, the launchers `Alchemy` and `Alchemy.bat`, and `NOTICE.txt`,'
            echo '`LICENSE.md` and `README.md`. Produced by `./gradlew distArchive` from a whitelisted'
            echo 'staging layout, so nothing ships because it happened to be lying around.'
            echo
            echo '## What was verified, and where'
            echo
            echo '| Check | Linux | Windows | macOS |'
            echo '| --- | --- | --- | --- |'
            echo '| Compiles on JDK 17 / 21 / 25 | yes | yes | yes |'
            echo '| Archive built, contents validated | yes | yes | yes |'
            echo '| Archive launched through its own launcher | yes, gating | runs, not gating yet | no |'
            echo '| All modules activate | yes | runs, not gated | no |'
            echo
            echo '"Runs, not gating yet" means the check executes and its verdict is published,'
            echo 'but a failure does not stop the release. It becomes a gate once it has been'
            echo 'seen passing on a real tag, and promoting it is a one-line change.'
            echo
            echo '## Reproducibility'
            echo
            echo 'The Windows and macOS jobs build the archive from the same commit and print'
            echo 'their own SHA-256 to the log. Entry dates come from the commit rather than from'
            echo 'the moment of building, so identical hashes across runners is a real result'
            echo 'rather than an artefact of timestamps; a difference names the platform where it'
            echo 'stopped being true. Gradle writes the date (`reproducibleFileTimestamp`) and'
            echo '`checkPackage` reads the archive headers back and asserts it, on every package'
            echo 'build, on both formats.'
            echo
            echo '## Known defects'
            echo
            echo '- macOS start-up: `com.bric.util.MacUtil` throws `NumberFormatException` while'
            echo '  parsing a resource in the vendored Quaqua jar, and the 2011 `OSXAdapter` is'
            echo '  refused reflective access to `com.apple.eawt.Application`. Removing Quaqua in'
            echo '  favour of the system look and feel is the planned fix; until then the macOS'
            echo '  smoke test runs with `continue-on-error`.'
            echo '- `AlcNative` has no source in this repository. It is not loaded on Linux, and'
            echo '  its only callers are macOS menu-bar toggles.'
            echo '- The `Alchemy.bat` launcher is executed inside a Windows runner by'
            echo '  `verifyDist`, informationally. Until that is observed passing on a tag, the'
            echo '  Windows launcher counts as unverified on real Windows hardware.'
            echo '- The launchers write to the installation directory (`log/`, `shapes/`), so a'
            echo '  read-only location prevents start-up. Moving that state to a per-user'
            echo '  directory is open work.'
            echo
            echo '## Build and test from source'
            echo
            echo '```sh'
            echo 'git clone https://github.com/pbiswal/Alchemy.git'
            echo "cd Alchemy && git checkout $GITHUB_REF_NAME"
            echo './gradlew clean build distArchive    # package plus checksums'
            echo './gradlew harnessTest                # log-parser checks, no display needed'
            echo './gradlew smokeTest                  # boots the app; needs a display (xvfb-run)'
            echo './gradlew verifyDist                 # launches the unpacked archive via its launcher'
            echo '```'
            echo
            echo '## Since the 2011 official release (008)'
            echo
            echo 'Gradle build alongside the legacy NetBeans/Ant project; CI across Linux,'
            echo 'Windows and macOS on JDK 17/21/25; the five modules whose source was never'
            echo 'published are gone (28 remain and 28 activate at start-up); a resize during'
            echo 'start-up no longer dereferences a toolbar that does not exist yet; releases are'
            echo 'built and published by CI from a tag instead of by hand.'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      # softprops/action-gh-release, pinned to a released tag. `files` is a
      # newline-delimited list of globs, and a glob that matches nothing is NOT an error
      # by default - so fail_on_unmatched_files is set explicitly. Without it, a release
      # that uploaded no assets would still be a green run with a published tag in front
      # of it, which is the one failure mode this step must not have.
      #
      # (The pin is worth checking against the registry: an earlier draft of this step
      # named an action that does not exist.)
      - name: Create the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Alchemy ${{ github.ref_name }} (unofficial)
          body_path: RELEASE_BODY.md
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/SHA256SUMS.txt
            RELEASE_NOTES.md
          fail_on_unmatched_files: true
          make_latest: 'true'
