#
# Publishing pipeline. Pushing a tag shaped like v0.9.0 builds ONE distribution on
# that exact commit, launch-tests it, and attaches it to a GitHub Release.
#
# There is one package, not three, because there is nothing platform-specific to
# select: the archive carries the JPen native libraries for every OS. Publishing
# alchemy-<v>-linux.tar.gz / -macos / -windows would be the same bytes under three
# names, and a reader would reasonably assume they differ. The three runners still
# each build and structurally check the package, which is what makes the single
# archive trustworthy rather than merely convenient - see verify-recipe below.
#
# Packaging happens here rather than on a laptop so an artifact cannot carry
# unrepeatable local state: the tag says which commit, the workflow log says which
# toolchain, and NOTICE.txt inside the archive says both.
#
name: Release

on:
  push:
    tags:
      # Only point releases. Requiring the leading "v" and digits keeps a stray
      # branch or tag name from ever matching and publishing something by accident.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  # Creating the release and uploading its assets.
  contents: write

jobs:
  package:
    # The published bytes are built here, on Linux, because Linux is where the
    # package can also be launched. A package built on Windows and launched
    # elsewhere would leave the launch verdict describing a different build.
    name: Package and launch
    runs-on: ubuntu-latest
    env:
      GRADLE_EXIT_CODE: 0
    steps:
      - uses: actions/checkout@v7

      # One toolchain for published artifacts. Bytecode targets --release 17 no
      # matter what builds it, but pinning keeps the launcher's version probe and the
      # native library handling identical from release to release.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        shell: bash
        # The tag is v0.9.0; the version inside the package is 0.9.0.
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, check and launch the package
        shell: bash
        # verifyDist unpacks the archive and starts it through its own ./Alchemy
        # launcher: the only check that can see a missing module directory, a jar name
        # the manifest does not match, or a launcher that forgot java.library.path.
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./gradlew --no-daemon \
              "-PalchemyVersion=${{ steps.version.outputs.value }}" \
              distArchive checkPackage verifyDist \
            || echo "GRADLE_EXIT_CODE=$?" >> "$GITHUB_ENV"
          cat build/distributions/SHA256SUMS.txt

      - name: Publish the packaged launch verdict
        if: always()
        shell: bash
        # The verdict file is the harness's own account of what it launched and saw;
        # the step summary is where a reviewer looks first.
        run: |
          if [ -f build/artifact-result.txt ]; then
            cat build/artifact-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$GRADLE_EXIT_CODE"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: build/distributions/
          if-no-files-found: error
          retention-days: 30

  verify-recipe:
    # Same recipe, other operating systems. Nothing from here is published: these
    # runners prove the packaging build itself is portable (the launcher bit, the
    # jar whitelist, the NOTICE stamp) and that their archive is the same one Linux
    # published, by printing the checksum into the job log for comparison.
    # Windows additionally tries launching the package, informationally: its start-up
    # is green in CI, and this is the platform most users have. macOS does not, because
    # its runtime is known-red - see MAINTENANCE.md.
    name: Verify packaging recipe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and check the package
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            "-PalchemyVersion=${{ steps.version.outputs.value }}" \
            distArchive checkPackage
          {
            echo "### Packaging recipe on ${{ matrix.os }}"
            echo
            echo 'Structural check passed. Checksums built here:'
            echo
            echo '```'
            cat build/distributions/SHA256SUMS.txt
            echo '```'
            echo
            echo 'Gradle writes archive entries with fixed timestamps, so these are expected'
            echo 'to equal the published archive byte for byte - the v0.9.0 run produced the'
            echo 'same hash on all three runners. A difference here is a real difference in'
            echo 'the bytes, not a timestamp.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately non-blocking: a first run on a real tag has to show whether the
      # packaged Alchemy.bat starts in a Windows runner at all. When it has been seen
      # passing, drop this step's if/verdict handling and make verifyDist a normal step
      # so Windows gates the release the way Linux does.
      - name: Launch the package here (informational, Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -uo pipefail
          if ./gradlew --no-daemon "-PalchemyVersion=${{ steps.version.outputs.value }}" verifyDist
          then
            verdict=PASS
          else
            verdict=FAIL
          fi
          {
            echo "### Packaged launch on ${{ matrix.os }}"
            echo
            echo "- verdict: \`$verdict\` (informational - Windows does not gate the release yet)"
            echo
            echo '```'
            cat build/artifact-result.txt 2>/dev/null || echo '(no result file written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = FAIL ]
          then
            echo "::warning::the packaged launcher did not prove itself on ${{ matrix.os }}"
          fi

  release:
    name: Publish GitHub Release
    needs: [package, verify-recipe]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the package
        uses: actions/download-artifact@v6
        with:
          name: package
          path: assets

      - name: Confirm the package survived the artifact round-trip
        working-directory: assets
        shell: bash
        # The checksums were written by the runner that produced the bytes. Verifying
        # them again here means the release cannot ship an asset that differs from what
        # was launch-tested, whoever moved it in between.
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          ls -l

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "### Unofficial build of Alchemy ${VERSION}"
            echo
            echo 'Built from `'"${GITHUB_SHA:0:12}"'` by GitHub Actions. The upstream project'
            echo '(karldd/Alchemy) has been unmaintained since 2018; this is a community-kept'
            echo 'build, not a release by the original author.'
            echo
            echo '### What ships'
            echo
            echo "| Asset | What it is |"
            echo '| --- | --- |'
            echo "| \`alchemy-${VERSION}-unofficial.tar.gz\` | The distribution as a POSIX tarball |"
            echo "| \`alchemy-${VERSION}-unofficial.zip\` | The same files in a zip |"
            echo "| \`SHA256SUMS.txt\` | Checksums of both archives |"
            echo
            echo 'One package serves every platform: Alchemy is a Java application and the'
            echo 'archive carries the JPen tablet native libraries for Linux, Windows and'
            echo 'macOS together, so there is nothing platform-specific to select. Take the'
            echo 'format your operating system unpacks most easily - the launcher bit on'
            echo '`./Alchemy` survives in both.'
            echo
            echo '### How it was verified'
            echo
            echo '| Check | Where |'
            echo '| --- | --- |'
            echo '| Unpacked and started through its own `./Alchemy` launcher: 28/28 modules active, no exceptions | Linux under Xvfb |'
            echo '| Package contents, manifest, launcher bit and module count | Linux, Windows and macOS runners |'
            echo "| \`NOTICE.txt\` names the commit these bytes came from | \`${GITHUB_SHA:0:12}\` |"
            echo
            echo '### Known state per platform'
            echo
            echo '- **Linux** - starts and is launch-tested in CI.'
            echo '- **Windows** - the CI smoke test is green and the package is structurally'
            echo '  checked, but the packaged launcher is not launch-tested in CI yet.'
            echo '- **macOS** - the runtime is broken: Quaqua 3.x and the old'
            echo '  `com.apple.eawt` adapter do not survive modern JDKs, so menu actions and'
            echo '  window chrome are unreliable. It is packaged, not fixed.'
            echo
            echo 'See [MAINTENANCE.md](https://github.com/pbiswal/Alchemy/blob/'"${GITHUB_REF_NAME}"'/MAINTENANCE.md)'
            echo 'for build instructions, test commands and the full list of known issues.'
            echo
            echo '### Running it'
            echo
            echo 'Needs a JDK 17 or newer on `PATH` (or `JAVA_HOME` set). Unpack, then:'
            echo
            echo '```sh'
            echo './Alchemy        # Linux, macOS'
            echo 'Alchemy.bat      # Windows'
            echo '```'
            echo
            echo 'A Wacom tablet is picked up through JPen where the packaged native library'
            echo 'matches the platform.'
            echo
            echo '### Verify'
            echo
            echo '```sh'
            # Single quotes on purpose: this line is a shell snippet to be pasted, not
            # one to be expanded here.
            echo 'grep "$(basename ARCHIVE)" SHA256SUMS.txt | sha256sum -c -'
            echo '```'
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      # softprops/action-gh-release, pinned to a released tag. `files` is a
      # newline-delimited list of globs, and a glob that matches nothing is NOT an error
      # by default - so fail_on_unmatched_files is set explicitly. Without it, a release
      # that uploaded no assets would still be a green run with a published tag in front
      # of it, which is the one failure mode this step must not have.
      #
      # (The pin is worth checking against the registry: an earlier draft of this step
      # named an action that does not exist.)
      - name: Create the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Alchemy ${{ github.ref_name }} (unofficial)
          body_path: RELEASE_BODY.md
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: 'true'
