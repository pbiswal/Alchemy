#
# Publishing pipeline. Pushing a tag shaped like v0.9.0 builds one package per
# platform on that exact commit and attaches all three to a GitHub Release.
#
# Packaging happens here rather than on a laptop so an artifact cannot carry
# unrepeatable local state: the tag says which commit, the workflow log says which
# toolchain, and NOTICE.txt inside the archive says both.
#
name: Release

on:
  push:
    tags:
      # Only point releases. Requiring the leading "v" and digits keeps a stray
      # branch or tag name from ever matching and publishing something by accident.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  # Creating the release and uploading its assets.
  contents: write

jobs:
  package:
    # One package per platform: lib/jpen holds a different native library per OS, so
    # a single archive cannot honestly serve all three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
          - os: windows-latest
            classifier: windows
          - os: macos-latest
            classifier: macos
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_EXIT_CODE: 0
    steps:
      - uses: actions/checkout@v7

      # One toolchain for published artifacts. Bytecode targets --release 17 no
      # matter what builds it, but pinning keeps the launcher's version probe and the
      # native library handling identical from release to release.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        shell: bash
        # The tag is v0.9.0; the version inside the package is 0.9.0.
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and verify package
        shell: bash
        # The Linux package is launched through its own launcher before it may ship:
        # that is the only check that can catch a missing module directory or a
        # manifest path the JVM will not follow. Windows and macOS get the structural
        # check only, because their start-up paths are separately known-red (Windows:
        # the resize/toolbar NPE, macOS: Quaqua + com.apple.eawt) - see
        # MAINTENANCE.md. Packaging still gates on every platform.
        run: |
          ARGS=(--no-daemon
                "-PalchemyVersion=${{ steps.version.outputs.value }}"
                "-PdistClassifier=${{ matrix.classifier }}"
                distArchive checkPackage)
          if [ "${{ matrix.classifier }}" = "linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
              ./gradlew "${ARGS[@]}" verifyDist || echo "GRADLE_EXIT_CODE=$?" >> "$GITHUB_ENV"
          else
            ./gradlew "${ARGS[@]}" || echo "GRADLE_EXIT_CODE=$?" >> "$GITHUB_ENV"
          fi
          cat build/distributions/SHA256SUMS.txt

      - name: Publish the packaged launch verdict
        if: always()
        shell: bash
        # The verdict file is the harness's own account of what it launched and saw;
        # the step summary is where a reviewer looks first.
        run: |
          if [ -f build/artifact-result.txt ]; then
            cat build/artifact-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$GRADLE_EXIT_CODE"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.classifier }}
          path: build/distributions/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the per-platform packages
        uses: actions/download-artifact@v6
        with:
          path: assets

      - name: Consolidate checksums
        working-directory: assets
        shell: bash
        # Each runner wrote its own SHA256SUMS.txt over its own two archives. One
        # authoritative list computed over the bytes that actually ship is worth more
        # than three same-named files: it verifies the download you really made.
        run: |
          set -euo pipefail
          rm -f */SHA256SUMS.txt
          find . -mindepth 2 -maxdepth 2 -type f -exec mv -- {} . \;
          rmdir -- */
          sha256sum alchemy-* > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "### Unofficial build of Alchemy ${VERSION}"
            echo
            echo 'Built from `'"${GITHUB_SHA:0:12}"'` by GitHub Actions. The upstream project'
            echo '(karldd/Alchemy) has been unmaintained since 2018; this is a community-kept'
            echo 'build, not a release by the original author.'
            echo
            echo '### What ships'
            echo
            echo '| Asset | Platform | Verified in CI |'
            echo '| --- | --- | --- |'
            echo "| \`alchemy-${VERSION}-unofficial-linux.tar.gz\` | Linux x86_64 | Launched from its own launcher: 28/28 modules, no exceptions |"
            echo "| \`alchemy-${VERSION}-unofficial-windows.zip\` | Windows x86_64 | Files, manifest and launcher checked; start-up still has known issues |"
            echo "| \`alchemy-${VERSION}-unofficial-macos.zip\` | macOS | Files, manifest and launcher checked; runtime is broken - see MAINTENANCE.md |"
            echo
            echo 'Both a `.tar.gz` and a `.zip` are published per platform; they hold the same'
            echo 'files. The launcher bit on `./Alchemy` survives in both.'
            echo
            echo '### Running it'
            echo
            echo 'Needs a JDK 17 or newer on `PATH` (or `JAVA_HOME` set). Unpack, then:'
            echo
            echo '```sh'
            echo './Alchemy        # Linux'
            echo 'Alchemy.bat      # Windows'
            echo '```'
            echo
            echo 'A Wacom tablet is picked up through JPen where the packaged native library'
            echo 'matches the platform.'
            echo
            echo '### Verify'
            echo
            echo '```sh'
            echo "grep \"\$\(basename ARCHIVE\)\" SHA256SUMS.txt | sha256sum -c -"
            echo '```'
            echo
            echo "Build instructions, test commands and known issues: [MAINTENANCE.md](https://github.com/pbiswal/Alchemy/blob/${GITHUB_REF_NAME}/MAINTENANCE.md)."
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      # softprops/action-gh-release, pinned to a released tag. `files` is a
      # newline-delimited list of globs, and a glob that matches nothing is NOT an error
      # by default - so fail_on_unmatched_files is set explicitly. Without it, a release
      # that uploaded no assets would still be a green run with a published tag in front
      # of it, which is the one failure mode this step must not have.
      #
      # (The pin is worth checking against the registry: an earlier draft of this step
      # named an action that does not exist.)
      - name: Create the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Alchemy ${{ github.ref_name }} (unofficial)
          body_path: RELEASE_BODY.md
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: 'true'
