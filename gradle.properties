# Gradle's own settings for building Alchemy. Tracked on purpose: it was untracked once, and a
# build that runs locally in a mode CI never runs is a build that surprises someone at release time.

# Release archive entries are stamped with the commit instant, and tar stores that as epoch seconds
# while a zip entry stores a *local* DOS date. Pinning the JVM zone makes the zip bytes identical on
# every machine instead of identical only to whoever shares the packager's timezone.
systemProp.user.timezone = UTC

# Reused task output after a clean: measured 1.3s against 1.8s for a clean :checkPackage on this
# tree. Small, free, and it grows more useful as the test task grows.
org.gradle.caching = true

# Configuration cache deliberately NOT enabled.
#
# It would buy about 0.1s: a warm :checkPackage is 0.39s with the cache off and 0.34s on. On a
# 4-task build, configuration is not the bottleneck.
#
# Making it work would also mean moving the release stamping out of gradle/archive-stamps.gradle,
# because closures published from a script plugin into ext. lose their script owner when the cache
# is *deserialized* (they work fine in-process, which is why a warm .gradle/ hides the problem):
# :distTar fails with "Cannot invoke method tarTimes() on null object" inside stampArchive. A script
# plugin cannot declare classes, so the fix is buildSrc or a JavaExec class - machinery that costs
# more than the tenth of a second, and that a 25k-line project cannot justify.
#
# What the attempt did leave behind, and what is worth keeping: task actions now read plain Strings
# and Files (repoDir, versionString) and Providers (distTar/distZip archiveFile) instead of resolving
# rootDir, project, file() and task objects at execution time. That is required by the cache and is
# simply correct when actions run in a different phase than their configuration.
