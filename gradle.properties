# Gradle's own settings for building Alchemy. Tracked on purpose: it was untracked once, and a
# build that runs locally in a mode CI never runs is a build that surprises someone at release time.

# No timezone pin, deliberately. Release archive entries are dated with the commit instant, and the
# first version of that stamped zip DOS dates by hand, where the JVM zone did decide the bytes and
# UTC had to be forced. Gradle's own reproducibleFileTimestamp (9.7.0+) encodes the DOS date in UTC
# itself, so the pin bought nothing: building with it deleted under TZ=UTC, America/Los_Angeles,
# Asia/Kolkata and America/Sao_Paulo gives byte-identical archives. A setting whose stated reason
# turns out to be false is a trap for the next reader, so it is gone rather than kept "to be safe".

# Reused task output after a clean: measured on this tree at 3s for `clean checkPackage` with this
# line and 4s with --no-build-cache. Small, free, and it grows more useful as the test task grows.
org.gradle.caching = true

# Configuration cache deliberately NOT enabled.
#
# It would buy almost nothing even if it worked. With it off, `clean checkPackage` is 3s and the full
# gated pipeline (clean check build distArchive checkPackage verifyDist, --no-daemon, JDK 25, under
# xvfb-run) is 4s; with --no-build-cache the same pipeline is also 4s, so configuration is not the
# bottleneck of a build this small.
#
# And it does not work. It fails while *storing* the entry, on the commit stamp:
#
#   Problem 1/2: external process started 'git log -1 --format=%ct'
#   at build.gradle: gitOutput, called from commitStamp
#
# commitEntryTime is a Provider, so the ordinary build never runs git during configuration - but a
# provider that feeds a task input is queried when the cache entry is stored, and storing is
# configuration-time work. The git call therefore still happens inside capture, and capture rejects
# it: the build fails warm and cold, in ~3.3s, where the same graph without the flag succeeds in 3.0s.
# The fix is a ValueSource (the supported shape for an external value used as an input), which means
# buildSrc because a script plugin cannot declare classes, plus straightening the JavaExec forks in
# run/smokeTest/verifyDist. Machinery bought for a saving measured at zero; see MAINTENANCE.md.
#
# What the attempt did leave behind, and what is worth keeping: task actions now read plain Strings
# and Files (repoDir, versionString) and Providers (distTar/distZip archiveFile) instead of resolving
# rootDir, project, file() and task objects at execution time. That is required by the cache and is
# simply correct when actions run in a different phase than their configuration.
